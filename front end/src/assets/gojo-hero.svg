<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Aura Gradients -->
    <radialGradient id="purpleGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Hair Gradients -->
    <linearGradient id="silverHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="darkJujutsuSuit" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    
    <!-- Blindfold Gradient -->
    <linearGradient id="blindfoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Cursed Energy Orb -->
    <radialGradient id="limitlessOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for ethereal glow -->
    <filter id="energyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Cursed Energy Auras -->
  <circle cx="350" cy="300" r="280" fill="url(#purpleGlow)"/>
  <circle cx="280" cy="240" r="220" fill="url(#blueGlow)"/>

  <!-- Character Silhouette & Body Group -->
  <g transform="translate(40, 20)">
    <!-- High Collar Jujutsu Coat (Torso & Shoulders) -->
    <path d="M160 520 L190 350 L240 330 L300 360 L360 330 L410 350 L440 520 L480 780 L120 780 Z" fill="url(#darkJujutsuSuit)"/>
    
    <!-- Collar Left & Right Fold -->
    <path d="M210 340 L240 280 L275 350 Z" fill="#18181b" stroke="#312e81" stroke-width="2"/>
    <path d="M390 340 L360 280 L325 350 Z" fill="#18181b" stroke="#312e81" stroke-width="2"/>
    <path d="M240 280 L275 350 L325 350 L360 280 L300 320 Z" fill="#0f172a"/>

    <!-- Neck -->
    <path d="M270 310 L270 260 L330 260 L330 310 Z" fill="#f8fafc"/>

    <!-- Jaw & Face -->
    <polygon points="260,200 300,265 340,200 335,160 265,160" fill="#fef2f2"/>
    <polygon points="290,265 300,265 305,255 295,255" fill="#e2e8f0"/>

    <!-- Smug Anime Smile / Mouth -->
    <path d="M285 240 Q300 248 315 240" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Iconic Black Blindfold Wrapping Head -->
    <path d="M245 160 Q300 150 355 160 L350 205 Q300 215 250 205 Z" fill="url(#blindfoldGrad)" stroke="#3f3f46" stroke-width="2"/>
    <!-- Blindfold creasing -->
    <path d="M255 175 Q300 168 345 175" stroke="#27272a" stroke-width="2" fill="none"/>
    <path d="M250 190 Q300 182 350 190" stroke="#18181b" stroke-width="2" fill="none"/>

    <!-- Eye Glow (Six Eyes piercing through blindfold) -->
    <ellipse cx="280" cy="182" rx="10" ry="4" fill="#38bdf8" opacity="0.8" filter="url(#energyGlow)"/>
    <ellipse cx="320" cy="182" rx="10" ry="4" fill="#38bdf8" opacity="0.8" filter="url(#energyGlow)"/>
    <circle cx="280" cy="182" r="3" fill="#ffffff"/>
    <circle cx="320" cy="182" r="3" fill="#ffffff"/>

    <!-- Spiky Silver Hair Strands -->
    <!-- Back Hair -->
    <path d="M230 170 L210 120 L245 135 L260 90 L280 120 L300 70 L320 120 L345 85 L355 130 L390 115 L370 170 Z" fill="#94a3b8"/>
    <!-- Main Crown Hair -->
    <path d="M240 160 L220 100 L255 125 L270 70 L290 110 L305 50 L325 105 L350 75 L360 120 L385 105 L365 160 Z" fill="url(#silverHair)"/>
    <!-- Top Highlights -->
    <path d="M255 125 L270 70 L285 110 Z" fill="url(#hairHighlight)"/>
    <path d="M290 110 L305 50 L320 105 Z" fill="#ffffff"/>
    <path d="M325 105 L350 75 L355 115 Z" fill="url(#hairHighlight)"/>
    <!-- Front Tuft details -->
    <path d="M250 155 L240 130 L260 145 Z" fill="#ffffff"/>
    <path d="M350 155 L360 130 L340 145 Z" fill="#ffffff"/>

    <!-- Coat Seams & Lighting Reflections -->
    <path d="M300 360 L300 780" stroke="#312e81" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M190 350 Q230 450 240 600" stroke="#1e1b4b" stroke-width="3" fill="none"/>
    <path d="M410 350 Q370 450 360 600" stroke="#1e1b4b" stroke-width="3" fill="none"/>

    <!-- Floating Hollow Purple Cursed Energy Sphere near hand -->
    <g transform="translate(140, 420)">
      <circle cx="40" cy="40" r="50" fill="url(#limitlessOrb)" filter="url(#energyGlow)"/>
      <ellipse cx="40" cy="40" rx="60" ry="15" fill="none" stroke="#a855f7" stroke-width="2" transform="rotate(-25, 40, 40)" opacity="0.8"/>
      <ellipse cx="40" cy="40" rx="60" ry="15" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(35, 40, 40)" opacity="0.8"/>
    </g>
  </g>
</svg>
